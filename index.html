<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Mercadinho Porto Itália — acesso rápido ao aplicativo e primeiros passos para moradores." />
  <title>Mercadinho Porto Itália</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#0F3D2E" />
</head>

<body>
  <!-- CONFIGURAÇÃO CENTRAL (edite apenas aqui) -->
  <script>
    window.PAGE_CONFIG = {
      siteName: "Mercadinho Porto Itália",
      welcomeMessage: "Bem-vindo! Baixe o aplicativo e comece a usar o mercadinho autônomo do condomínio.",

      links: {
        googlePlayUrl: "https://play.google.com/store/apps/details?id=br.com.vertitecnologia.vmmarket.okeo&pcampaignid=web_share",
        appStoreUrl: "https://apps.apple.com/br/app/okeo-minimercados/id6444526749",
        whatsappUrl: "https://wa.me/5551995094869"
      },

      funcionamento: {
        horario: "24 horas"
      },

      pagamento: {
        formas: "Pagamentos via Pix, débito e crédito."
      },

      passos: [
        "Baixe o app.",
        "Realize o cadastro.",
        "Selecione a loja.",
        "Destrave a porta.",
        "Boas compras!"
      ]
    };
  </script>

  <header class="header">
    <div class="container headerInner">
      <!-- Removido avatar/foto de perfil -->
      <div class="headerText">
        <!-- Título centralizado como você pediu -->
        <h1 class="siteTitle" id="siteTitle">Mercadinho Porto Itália</h1>
        <p class="welcome" id="welcomeMessage"></p>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="buttonGrid" role="navigation" aria-label="Downloads e atendimento">
          <!-- Google Play -->
          <a class="btn primary large" id="btnGooglePlay" href="#" target="_blank" rel="noopener">
            <span class="btnIcon" aria-hidden="true">
              <!-- ícone Google Play (simples, embutido) -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path fill="#49d17a" d="M6.6 4.9 15 12l-8.4 7.1L6 16.2 12.2 12 6 7.8 6.6 4.9Z"/>
                <path fill="#ffffff" opacity=".85" d="M15 12 6.6 4.9 6 7.8 12.2 12 6 16.2l.6 1.9L15 12Z"/>
                <path fill="#1f6f52" d="M15 12 6.6 19.1l7.8-3.1 1.6-1.3-1-2.7Z" opacity=".25"/>
              </svg>
            </span>
            <span class="btnText">Google Play</span>
          </a>

          <!-- App Store -->
          <a class="btn primary large alt" id="btnAppStore" href="#" target="_blank" rel="noopener">
            <span class="btnIcon" aria-hidden="true">
              <!-- ícone App Store (simples, embutido) -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path fill="#ffffff" d="M16.6 13.3c0 2.6 2.3 3.5 2.3 3.5s-1.7 4.9-4.2 4.9c-1.2 0-2.1-.8-3.4-.8s-2.3.8-3.4.8c-2.3 0-4.4-4.6-4.4-8.1 0-3.8 2.4-5.8 4.7-5.8 1.2 0 2.2.8 3.4.8s2.2-.9 3.6-.9c.5 0 2.9.1 4.2 2.2-3.7 2-3.8 6.4-3.8 6.4Z"/>
                <path fill="#49d17a" d="M14.9 2.2c.3 1.6-.4 3.2-1.1 4-.7.8-1.9 1.4-3.1 1.3-.1-1.4.4-2.8 1.1-3.7.7-.9 2-1.7 3.1-1.6Z" opacity=".95"/>
              </svg>
            </span>
            <span class="btnText">App Store</span>
          </a>

          <!-- WhatsApp -->
          <a class="btn primary large whatsapp" id="btnWhatsApp" href="#" target="_blank" rel="noopener">
            <span class="btnIcon" aria-hidden="true">
              <!-- ícone WhatsApp (simples, embutido) -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path fill="#ffffff" d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3Z" opacity=".95"/>
                <path fill="#0F3D2E" d="M15.8 14.8c-.2.6-1.1 1.1-1.6 1.1-.4 0-.8.1-1.5-.2-.8-.3-1.6-.9-2.3-1.6-.7-.7-1.3-1.6-1.6-2.3-.3-.7-.2-1.1-.2-1.5 0-.5.5-1.4 1.1-1.6.2-.1.5 0 .7.3l.8 1.9c.1.2.1.4 0 .6-.1.2-.2.3-.3.4l-.2.3c-.1.2-.1.4 0 .6.2.4.6 1 1.2 1.6.6.6 1.2 1.1 1.6 1.2.2.1.4.1.6 0l.3-.2c.1-.1.3-.2.4-.3.2-.1.4-.1.6 0l1.9.8c.3.1.4.4.3.7Z"/>
                <path fill="#49d17a" d="M9.7 7.9c.1-.3.3-.3.4-.3.2 0 .3 0 .5.3l.8 1.8c.1.2.1.4 0 .6l-.4.4c-.2.2-.2.4-.1.6.2.5.6 1.1 1.2 1.7.6.6 1.2 1.1 1.7 1.2.2.1.4.1.6-.1l.4-.4c.2-.2.4-.2.6 0l1.8.8c.3.1.3.3.3.5 0 .1 0 .3-.3.4-.5.3-1.2.6-1.9.4-.8-.2-1.9-.8-3-2s-1.8-2.2-2-3c-.2-.7.1-1.4.4-1.9Z" opacity=".6"/>
              </svg>
            </span>
            <span class="btnText">WhatsApp</span>
          </a>
        </div>

        <p class="smallNote" id="downloadHint">Acesso rápido para baixar e começar.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="sectionTitle">Primeiros passos</h2>

        <div class="steps">
          <article class="card">
            <h3 class="cardTitle">Siga as etapas</h3>
            <ol class="list listNumbers" id="passosList"></ol>
          </article>
        </div>
      </div>
    </section>

    <section class="section altBg">
      <div class="container">
        <h2 class="sectionTitle">Informações úteis</h2>

        <div class="infoGrid">
          <div class="card">
            <h3 class="cardTitle">Horário de funcionamento</h3>
            <p class="muted" id="horario"></p>
          </div>

          <div class="card">
            <h3 class="cardTitle">Formas de pagamento</h3>
            <p class="muted" id="pagamento"></p>
          </div>
        </div>

        <!-- Removido conteúdo: “Como funciona o mercado autônomo” -->
      </div>
    </section>

    <div class="footer">
      <div class="container footerRow">
        <span class="footerText">Acesse pelo QR na porta do mercadinho.</span>
      </div>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
